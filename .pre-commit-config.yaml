repos:
  # 1. Secret Scanning (Replaces your gitleaks loop)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # 2. Linting & Formatting (Replaces bun lint/format using Ruff)
  # Since your pyproject.toml tasks use ruff, we use the official ruff hooks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 3. Commit Message Linting
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
